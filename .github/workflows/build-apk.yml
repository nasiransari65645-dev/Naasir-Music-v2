name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_OUTPUT"

          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version from '$JAVA_VER_OUTPUT'"
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 21 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 21! AGP 9.1.1 requires Java 21."
            exit 1
          fi
          echo "Java environment verified successfully: Version $JAVA_MAJOR >= 21."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare build environment and debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in workspace."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create or find ./debug.keystore!"
            exit 1
          fi
          echo "Debug keystore confirmed present."

          # Ensure .env is present from template if needed
          if [ ! -f "./.env" ] && [ -f "./.env.example" ]; then
            cp "./.env.example" "./.env"
          fi

          # Accept Android SDK licenses and ensure SDK 36 is available
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses" 2>/dev/null || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" | tee "$ANDROID_HOME/licenses/android-sdk-license" "$ANDROID_SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || true
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" | tee "$ANDROID_HOME/licenses/android-sdk-preview-license" "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license" 2>/dev/null || true
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" | tee "$ANDROID_HOME/licenses/android-googletv-license" "$ANDROID_SDK_ROOT/licenses/android-googletv-license" 2>/dev/null || true

          # Locate sdkmanager across all standard locations
          SDKMGR=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMGR=$(command -v sdkmanager)
          elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMGR" ]; then
            echo "Accepting Android SDK licenses via sdkmanager ($SDKMGR)..."
            yes | "$SDKMGR" --licenses 2>/dev/null || true
            echo "Installing platforms;android-36 and build-tools;36.0.0..."
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.workers.max=2

      - name: Verify the APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Target APK '$TARGET_APK' not found!"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK file '$TARGET_APK' exists but is empty (0 bytes)!"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: File '$TARGET_APK' does not have .apk extension!"; exit 1 ;;
          esac

          APK_SIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || stat -f%z "$TARGET_APK")
          echo "Verified APK: $TARGET_APK"
          echo "File size: $APK_SIZE bytes"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          RELEASE_ASSET="$TEMP_DIR/app-debug.apk"

          cp "$SOURCE_APK" "$RELEASE_ASSET"

          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared release asset '$RELEASE_ASSET' is missing or empty!"
            exit 1
          fi

          echo "Prepared release asset at: $RELEASE_ASSET"
          echo "asset_path=$RELEASE_ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset path is invalid or file does not exist!"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is empty!"
            exit 1
          fi

          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly 'app-debug.apk', but got '$ASSET_NAME'!"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          echo "Release Tag: $TAG_NAME"
          echo "Release Title: $RELEASE_TITLE"
          echo "Target Commit: $TARGET_COMMIT"

          printf "### Automated Debug APK Release\n" > /tmp/release_notes.md
          printf "This is an automatically generated debug APK built by GitHub Actions.\n\n" >> /tmp/release_notes.md
          printf -- "- **GitHub Actions Run:** #%s (Attempt %s)\n" "${{ github.run_number }}" "${{ github.run_attempt }}" >> /tmp/release_notes.md
          printf -- "- **Source Commit:** \`%s\`\n" "${{ github.sha }}" >> /tmp/release_notes.md
          printf -- "- **Notice:** This APK is signed with a temporary debug keystore and intended for testing only. It is not a Google Play Store production release.\n" >> /tmp/release_notes.md

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_COMMIT" \
            --notes-file /tmp/release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download Result Summary ==="
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release created successfully!"
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Asset Name: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            {
              echo "## 📱 DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "> **Note:** The normal Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation failed or did not run."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully and is preserved in GitHub Actions artifacts as 'app-debug-apk'."
            fi
            echo "The Actions artifact 'app-debug-apk' remains available."
          fi
